# Project-level OpenAI Codex CLI configuration (noesis)
model = "gpt-6.2-astra"
model_reasoning_effort = "xhigh"

[features]
multi_agent = true

[mcp_servers.codebase-memory]
command = "codebase-memory-mcp"
args = []

[mcp_servers.xerj]
command = "xerj"
args = ["mcp"]

[mcp_servers.xerj.env]
XERJ_URL = "http://127.0.0.1:9200"
XERJ_DISABLE_FEEDBACK = "true"

[mcp_servers.nautilus-engine]
command = "uv"
args = ["run", "--no-sync", "python", "scripts/nautilus_mcp_server.py"]

[mcp_servers.edgartools]
command = "uv"
args = ["run", "--no-sync", "edgartools-mcp"]

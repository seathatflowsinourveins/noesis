id: no-raw-http-broker-polling
language: python
severity: error
message: >-
  Raw HTTP polling (requests/httpx/aiohttp/ib_async) prohibited in src/. Use official typed upstreams
  (nautilus_trader, alpaca-py, edgartools, fredapi, opentelemetry-sdk).
rule:
  any:
    - pattern: import requests
    - pattern: import requests as $ALIAS
    - pattern: from requests import $$$
    - pattern: import httpx
    - pattern: import httpx as $ALIAS
    - pattern: from httpx import $$$
    - pattern: import aiohttp
    - pattern: import aiohttp as $ALIAS
    - pattern: from aiohttp import $$$
    - pattern: import ib_async
    - pattern: import ib_async as $ALIAS
    - pattern: from ib_async import $$$
    - all:
        - kind: call

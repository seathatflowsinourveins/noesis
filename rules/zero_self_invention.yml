    - pattern: from vectorbt import $$$
    - pattern: import zipline
    - pattern: import zipline as $ALIAS
    - pattern: from zipline import $$$
    - pattern: import pypfopt
    - pattern: import pypfopt as $ALIAS
    - pattern: from pypfopt import $$$
    - pattern: import pyportfolioopt
    - pattern: import pyportfolioopt as $ALIAS
    - pattern: from pyportfolioopt import $$$
    - pattern: import riskfolio
    - pattern: import riskfolio as $ALIAS
    - pattern: from riskfolio import $$$
    - pattern: import alphalens
    - pattern: import alphalens as $ALIAS
    - pattern: from alphalens import $$$
    - pattern: import wandb
    - pattern: import wandb as $ALIAS
    - pattern: from wandb import $$$
    - pattern: import clearml
    - pattern: import clearml as $ALIAS
    - pattern: from clearml import $$$
    - pattern: import neptune
    - pattern: import neptune as $ALIAS
    - pattern: from neptune import $$$
    - pattern: import prefect
    - pattern: import prefect as $ALIAS
    - pattern: from prefect import $$$
    - pattern: import deepeval
    - pattern: import deepeval as $ALIAS
    - pattern: from deepeval import $$$
    - pattern: import streamlit
    - pattern: import streamlit as $ALIAS
    - pattern: from streamlit import $$$
    - pattern: import finrl
    - pattern: import finrl as $ALIAS
    - pattern: from finrl import $$$
    - pattern: import fingpt
    - pattern: import fingpt as $ALIAS
    - pattern: from fingpt import $$$
    - pattern: import rdagent
    - pattern: import rdagent as $ALIAS
    - pattern: from rdagent import $$$
    - pattern: import rd_agent
    - pattern: import rd_agent as $ALIAS
    - pattern: from rd_agent import $$$
    - pattern: import mkdocs
    - pattern: import mkdocs as $ALIAS
    - pattern: from mkdocs import $$$
    - pattern: import sktime
    - pattern: import sktime as $ALIAS
    - pattern: from sktime import $$$
    - pattern: import freqtrade
    - pattern: import freqtrade as $ALIAS
    - pattern: from freqtrade import $$$
    - pattern: import pybroker
    - pattern: import pybroker as $ALIAS
    - pattern: from pybroker import $$$
    - all:
        - kind: call
        - has:
            kind: string_content
            regex: '^(?:yfinance|backtrader|backtesting|mlfinlab|tcapy|vollib|py_vollib|abides|tradingview_ta|pandas_datareader|talib|vectorbt|zipline|pypfopt|pyportfolioopt|riskfolio|alphalens|wandb|clearml|neptune|prefect|deepeval|streamlit|finrl|fingpt|rdagent|rd_agent|mkdocs|sktime|freqtrade|pybroker|fastapi|starlette|httpx|aiohttp|ib_async|requests|flask|dash|gradio|nicegui|panel|bokeh|uvicorn|quart|sanic|tornado|http\.server)(?:\..*)?$'
            stopBy: end
        - any:
            - pattern: importlib.import_module($$$ARGS)
            - pattern: $OBJ.import_module($$$ARGS)
            - pattern: import_module($$$ARGS)
            - pattern: __import__($$$ARGS)
            - pattern: $MOD.__import__($$$ARGS)
            - pattern: getattr($OBJ, "import_module")($$$ARGS)
            - pattern: getattr($OBJ, 'import_module')($$$ARGS)
            - pattern: getattr($OBJ, "__import__")($$$ARGS)
            - pattern: getattr($OBJ, '__import__')($$$ARGS)
            - pattern: $OBJ.__getattribute__("import_module")($$$ARGS)
            - pattern: $OBJ.__getattribute__('import_module')($$$ARGS)
            - pattern: $OBJ.__getattribute__("__import__")($$$ARGS)
            - pattern: $OBJ.__getattribute__('__import__')($$$ARGS)
            - pattern: object.__getattribute__($OBJ, "import_module")($$$ARGS)
            - pattern: object.__getattribute__($OBJ, 'import_module')($$$ARGS)
            - pattern: object.__getattribute__($OBJ, "__import__")($$$ARGS)
            - pattern: object.__getattribute__($OBJ, '__import__')($$$ARGS)
            - pattern: $OBJ.__dict__["import_module"]($$$ARGS)
            - pattern: $OBJ.__dict__['import_module']($$$ARGS)
            - pattern: $OBJ.__dict__.get("import_module")($$$ARGS)
            - pattern: $OBJ.__dict__.get('import_module')($$$ARGS)
            - pattern: vars($OBJ)["import_module"]($$$ARGS)
            - pattern: vars($OBJ)['import_module']($$$ARGS)
            - pattern: __builtins__["__import__"]($$$ARGS)
            - pattern: __builtins__['__import__']($$$ARGS)
            - pattern: __builtins__.get("__import__")($$$ARGS)
            - pattern: __builtins__.get('__import__')($$$ARGS)
            - pattern: builtins.__dict__["__import__"]($$$ARGS)
            - pattern: builtins.__dict__['__import__']($$$ARGS)
            - pattern: operator.attrgetter("import_module")($OBJ)($$$ARGS)
            - pattern: operator.attrgetter('import_module')($OBJ)($$$ARGS)
            - pattern: attrgetter("import_module")($OBJ)($$$ARGS)
            - pattern: attrgetter('import_module')($OBJ)($$$ARGS)
            - pattern: operator.attrgetter("__import__")($OBJ)($$$ARGS)
            - pattern: operator.attrgetter('__import__')($OBJ)($$$ARGS)
            - pattern: attrgetter("__import__")($OBJ)($$$ARGS)
            - pattern: attrgetter('__import__')($OBJ)($$$ARGS)
            - all:
                - pattern: $FN($$$ARGS)
                - inside:
                    kind: module
                    stopBy: end
                    has:
                      any:
                        - pattern: from importlib import import_module as $FN
                        - pattern: from builtins import __import__ as $FN
                        - pattern: $FN = importlib.import_module
                        - pattern: $FN = __import__
files:
  - src/**/*.py
  - scripts/**/*.py

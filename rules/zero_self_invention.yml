id: no-live-broker-endpoint
language: python
severity: error
message: Hard-refused live broker endpoint or live port/mode call inside production source or scripts.
rule:
  any:
    - pattern: '"api.alpaca.markets"'
    - pattern: '"https://api.alpaca.markets"'
    - kind: string_content
      regex: '(?i)(?:^|//|[^a-z0-9.-])api\.alpaca\.markets'
    - all:
        - any:
            - kind: binary_operator
            - kind: concatenated_string
            - pattern: $SEP.join($PARTS)
            - pattern: $TMPL.format($$$ARGS)
            - all:
                - kind: string
                - has:
                    kind: interpolation
        - not:
            has:
              kind: string_content
              regex: '(?i)(?:paper-api|data\.alpaca)'
              stopBy: end
        - any:
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)(?:^|//|[^a-z0-9.-])api\.?$'
                    stopBy: end
                - has:
                    kind: string_content
                    regex: '(?i)^\.?alpaca\.markets'
                    stopBy: end
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)(?:^|//|[^a-z0-9.-])api\.alpaca\.?$'
                    stopBy: end
                - has:
                    kind: string_content
                    regex: '(?i)^\.?markets'
                    stopBy: end
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)(?:^|//|[^a-z0-9.-])api\.[a-z.]*$'
                    stopBy: end
                - has:
                    kind: string_content
                    regex: '(?i)^(?:lpaca|paca|aca|ca|a)\.?markets'
                    stopBy: end
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)(?:^|//|[^a-z0-9.-])api\.?$'
                    stopBy: end
                - has:
                    kind: string_content
                    regex: '(?i)^\.?[a-z.]{1,12}$'
                    stopBy: end
                - has:
                    kind: string_content
                    regex: '(?i)^\.?markets'
                    stopBy: end
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)(?:^|//|[^a-z0-9.-])api\.?$'
                    stopBy: end
                - has:
                    kind: string_content
                    regex: '(?i)^\.?al$'
                    stopBy: end
                - has:
                    kind: string_content
                    regex: '(?i)^(?:lpaca|paca|aca|ca|a)\.?markets'
                    stopBy: end
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)(?:\{[A-Za-z0-9_]*\}|%[sd]|%\([A-Za-z0-9_]+\)[sd])\.alpaca\.markets'
                    stopBy: end
                - has:
                    kind: string_content
                    regex: '(?i)^(?:https?://)?api\.?$'
                    stopBy: end
    - all:
        - pattern: $VAR + $RIGHT
        - has:
            kind: string_content
            regex: '(?i)^\.?alpaca\.markets'
            stopBy: end
        - inside:
            kind: module
            stopBy: end
            has:
              stopBy: end
              all:
                - pattern: $VAR = $LEFT
                - has:
                    kind: string_content
                    regex: '(?i)(?:^|//|[^a-z0-9.-])api\.?$'
                    stopBy: end
                - not:
                    has:
                      kind: string_content
                      regex: '(?i)(?:paper-api|data\.alpaca)'
                      stopBy: end
    - kind: string_content
      regex: '(?i)(?:(?:https?|wss?|tcp)://[^\s"'']*?:|(?:[A-Za-z0-9.-]+|\[[0-9a-fA-F:]+\]):|^:)(?:4001|7496|8798|8796)\b'
    - all:
        - kind: string
        - has:
            kind: string_content
            regex: '^(?:4001|7496|8798|8796)$'
            stopBy: end
        - follows:
            kind: string
            has:
              kind: string_content
              regex: '^--port$'
              stopBy: end
            stopBy: end
    - kind: string_content
      regex: '^--port=(?:4001|7496|8798|8796)$'
    - all:
        - kind: keyword_argument
        - any:
            - all:
                - has:
                    field: name
                    regex: '(?i)^(?:[A-Za-z0-9_]*_)?PORT$'
                - has:
                    field: value
                    any:
                      - regex: '^["'']?(?:4001|7496|8798|8796)["'']?$'
                      - all:
                          - pattern: int($ARG)
                          - has:
                              stopBy: end
                              any:
                                - { kind: string_content, regex: '^(?:4001|7496|8798|8796)$' }
                                - { kind: integer, regex: '^(?:4001|7496|8798|8796)$' }
                      - pattern: 4000 + 1
                      - pattern: 1 + 4000
                      - pattern: 4002 - 1
                      - pattern: 7490 + 6
                      - pattern: 7400 + 96
                      - pattern: 7497 - 1
                      - pattern: 8790 + 8
                      - pattern: 8700 + 98
                      - pattern: 8790 + 6
                      - pattern: 8700 + 96
                      - all:
                          - kind: binary_operator
                          - any:
                              - all:
                                  - has: { kind: string_content, regex: '^(?:4|40|400)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:001|01|1)$', stopBy: end }
                              - all:
                                  - has: { kind: string_content, regex: '^(?:7|74|749)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:496|96|6)$', stopBy: end }
                              - all:
                                  - has: { kind: string_content, regex: '^(?:8|87|879)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:798|98|8|796|96|6)$', stopBy: end }
            - all:
                - has:
                    field: name
                    regex: '(?i)^(?:paper|paper_mode|is_paper|paper_trading)$'
                - has:
                    field: value
                    regex: '^(?:False|0)$'
    - all:
        - kind: assignment
        - not:
            has:
              field: left
              regex: '^FORBIDDEN_'
        - any:
            - all:
                - has:
                    field: left
                    any:
                      - regex: '(?i)^(?:[A-Za-z0-9_]*_)?PORT$'
                      - all:
                          - kind: attribute
                          - has:
                              field: attribute
                              regex: '(?i)^(?:[A-Za-z0-9_]*_)?PORT$'
                      - all:
                          - kind: subscript
                          - has:
                              kind: string_content
                              regex: '(?i)^(?:[A-Za-z0-9_]*_)?PORT$'
                              stopBy: end
                - has:
                    field: right
                    any:
                      - regex: '^["'']?(?:4001|7496|8798|8796)["'']?$'
                      - all:
                          - pattern: int($ARG)
                          - has:
                              stopBy: end
                              any:
                                - { kind: string_content, regex: '^(?:4001|7496|8798|8796)$' }
                                - { kind: integer, regex: '^(?:4001|7496|8798|8796)$' }
                      - pattern: 4000 + 1
                      - pattern: 1 + 4000
                      - pattern: 4002 - 1
                      - pattern: 7490 + 6
                      - pattern: 7400 + 96
                      - pattern: 7497 - 1
                      - pattern: 8790 + 8
                      - pattern: 8700 + 98
                      - pattern: 8790 + 6
                      - pattern: 8700 + 96
                      - all:
                          - kind: binary_operator
                          - any:
                              - all:
                                  - has: { kind: string_content, regex: '^(?:4|40|400)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:001|01|1)$', stopBy: end }
                              - all:
                                  - has: { kind: string_content, regex: '^(?:7|74|749)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:496|96|6)$', stopBy: end }
                              - all:
                                  - has: { kind: string_content, regex: '^(?:8|87|879)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:798|98|8|796|96|6)$', stopBy: end }
            - all:
                - has:
                    field: left
                    any:
                      - regex: '(?i)^(?:paper|paper_mode|is_paper|paper_trading)$'
                      - all:
                          - kind: attribute
                          - has:
                              field: attribute
                              regex: '(?i)^(?:paper|paper_mode|is_paper|paper_trading)$'
                      - all:
                          - kind: subscript
                          - has:
                              kind: string_content
                              regex: '(?i)^(?:paper|paper_mode|is_paper|paper_trading)$'
                              stopBy: end
                - has:
                    field: right
                    regex: '^(?:False|0)$'
    - all:
        - kind: pair
        - any:
            - all:
                - has:
                    field: key
                    has:
                      kind: string_content
                      regex: '(?i)^(?:[A-Za-z0-9_]*_)?PORT$'
                      stopBy: end
                - has:
                    field: value
                    any:
                      - regex: '^["'']?(?:4001|7496|8798|8796)["'']?$'
                      - all:
                          - pattern: int($ARG)
                          - has:
                              stopBy: end
                              any:
                                - { kind: string_content, regex: '^(?:4001|7496|8798|8796)$' }
                                - { kind: integer, regex: '^(?:4001|7496|8798|8796)$' }
                      - pattern: 4000 + 1
                      - pattern: 1 + 4000
                      - pattern: 4002 - 1
                      - pattern: 7490 + 6
                      - pattern: 7400 + 96
                      - pattern: 7497 - 1
                      - pattern: 8790 + 8
                      - pattern: 8700 + 98
                      - pattern: 8790 + 6
                      - pattern: 8700 + 96
                      - all:
                          - kind: binary_operator
                          - any:
                              - all:
                                  - has: { kind: string_content, regex: '^(?:4|40|400)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:001|01|1)$', stopBy: end }
                              - all:
                                  - has: { kind: string_content, regex: '^(?:7|74|749)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:496|96|6)$', stopBy: end }
                              - all:
                                  - has: { kind: string_content, regex: '^(?:8|87|879)$', stopBy: end }
                                  - has: { kind: string_content, regex: '^(?:798|98|8|796|96|6)$', stopBy: end }
            - all:
                - has:
                    field: key
                    has:
                      kind: string_content
                      regex: '(?i)^(?:paper|paper_mode|is_paper|paper_trading)$'
                      stopBy: end
                - has:
                    field: value
                    regex: '^(?:False|0)$'
    - all:
        - pattern: $OBJ.setdefault($KEY, $VAL)
        - any:
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)^(?:[A-Za-z0-9_]*_)?PORT$'
                    stopBy: end
                - any:
                    - has:
                        kind: string_content
                        regex: '^(?:4001|7496|8798|8796)$'
                        stopBy: end
                    - has:
                        kind: integer
                        regex: '^(?:4001|7496|8798|8796)$'
                        stopBy: end
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)^(?:paper|paper_mode|is_paper|paper_trading)$'
                    stopBy: end
                - any:
                    - pattern: $OBJ.setdefault($KEY, False)
                    - pattern: $OBJ.setdefault($KEY, 0)
    - all:
        - any:
            - pattern: setattr($OBJ, $KEY, $VAL)
            - pattern: $OBJ.__setattr__($KEY, $VAL)

id: no-banned-library-import
language: python
severity: error
message: Banned/self-built library import prohibited under Tier-0 Upstream-Only Charter.
rule:
  any:
    - { kind: import_statement, regex: '\b(?:yfinance|backtrader|backtesting|mlfinlab|tcapy|vollib|py_vollib|abides|tradingview_ta|pandas_datareader|talib|vectorbt|zipline|pypfopt|pyportfolioopt|riskfolio|alphalens|wandb|clearml|neptune|prefect|deepeval|streamlit|finrl|fingpt|rdagent|rd_agent|mkdocs|sktime|freqtrade|pybroker)\b' }
    - { kind: import_from_statement, regex: '^from\s+(?:yfinance|backtrader|backtesting|mlfinlab|tcapy|vollib|py_vollib|abides|tradingview_ta|pandas_datareader|talib|vectorbt|zipline|pypfopt|pyportfolioopt|riskfolio|alphalens|wandb|clearml|neptune|prefect|deepeval|streamlit|finrl|fingpt|rdagent|rd_agent|mkdocs|sktime|freqtrade|pybroker)\b' }
    - all: [{ kind: call, regex: '(?:import_module|__import__)' }, { has: { kind: string_content, regex: '^(?:yfinance|backtrader|backtesting|mlfinlab|tcapy|vollib|py_vollib|abides|tradingview_ta|pandas_datareader|talib|vectorbt|zipline|pypfopt|pyportfolioopt|riskfolio|alphalens|wandb|clearml|neptune|prefect|deepeval|streamlit|finrl|fingpt|rdagent|rd_agent|mkdocs|sktime|freqtrade|pybroker|fastapi|starlette|httpx|aiohttp|ib_async|requests|flask|dash|gradio|nicegui|panel|bokeh|uvicorn|quart|sanic|tornado|http\.server)(?:\..*)?$', stopBy: end } }]
files: [src/**/*.py, scripts/**/*.py]
---
id: no-live-broker-endpoint
language: python
severity: error
message: Hard-refused live broker endpoint or live port/mode call inside production source or scripts.
rule:
  any:
    - { kind: string_content, regex: '(?i)(?:^|//|[^a-z0-9.-])api\.alpaca\.markets' }
    - { kind: string_content, regex: '(?i)(?:(?:https?|wss?|tcp)://[^\s"''`]*?:|(?:[A-Za-z0-9.-]+|\[[0-9a-fA-F:]+\]):|^:|--port=)(?:4001|7496|8798|8796)\b' }
    - all: [{ kind: string }, { has: { kind: string_content, regex: '^(?:4001|7496|8798|8796)$', stopBy: end } }, { follows: { kind: string, has: { kind: string_content, regex: '^--port$', stopBy: end }, stopBy: end } }]
    - { kind: keyword_argument, regex: '(?i)^(?:(?:[A-Za-z0-9_]*_)?port\s*=\s*(?:["'']?(?:4001|7496|8798|8796)["'']?|int\(["'']?(?:4001|7496|8798|8796)["'']?\))|(?:paper|paper_mode|is_paper|paper_trading)\s*=\s*(?:False|0))$' }
    - all: [{ kind: assignment }, { not: { regex: '^FORBIDDEN_' } }, { regex: '(?i)(?:(?:[A-Za-z0-9_]*_)?port["'']?\]?\s*=\s*(?:["'']?(?:4001|7496|8798|8796)["'']?|int\(["'']?(?:4001|7496|8798|8796)["'']?\))|(?:paper|paper_mode|is_paper|paper_trading)["'']?\]?\s*=\s*(?:False|0))$' }]
    - { kind: pair, regex: '(?i)^["''](?:(?:[A-Za-z0-9_]*_)?port["'']\s*:\s*(?:["'']?(?:4001|7496|8798|8796)["'']?|int\(["'']?(?:4001|7496|8798|8796)["'']?\))|(?:paper|paper_mode|is_paper|paper_trading)["'']\s*:\s*(?:False|0))$' }
    - { kind: call, regex: '(?i)(?:setdefault|setattr|__setattr__)\s*\([^)]*(?:port["'']\s*,\s*["'']?(?:4001|7496|8798|8796)["'']?|(?:paper|paper_mode|is_paper|paper_trading)["'']\s*,\s*(?:False|0))' }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-custom-dashboard-server
language: python
severity: error
message: Hand-written custom web/HTML dashboard prohibited; use FINOS :1420, Grafana :3001, Prometheus :9090, or Caddy :8793.
rule:
  any:
    - { kind: import_statement, regex: '\b(?:fastapi|starlette|flask|dash|gradio|nicegui|panel|bokeh|uvicorn|quart|sanic|tornado|http\.server)\b' }
    - { kind: import_from_statement, regex: '^from\s+(?:fastapi|starlette|flask|dash|gradio|nicegui|panel|bokeh|uvicorn|quart|sanic|tornado|http\.server)\b|^from\s+http\s+import\s+.*\bserver\b' }
    - { kind: identifier, regex: '^(?:HTTPServer|ThreadingHTTPServer|BaseHTTPRequestHandler|SimpleHTTPRequestHandler|HTMLResponse)$' }
    - all: [{ kind: call, regex: '(?:import_module|__import__)' }, { has: { kind: string_content, regex: '^(?:fastapi|starlette|flask|dash|gradio|nicegui|panel|bokeh|uvicorn|quart|sanic|tornado|http\.server)(?:\..*)?$', stopBy: end } }]
files: [src/**/*.py, scripts/**/*.py]
---
id: no-raw-http-broker-polling
language: python
severity: error
message: Raw HTTP polling (requests/httpx/aiohttp/ib_async) prohibited; use official typed upstreams.
rule:
  any:
    - { kind: import_statement, regex: '\b(?:requests|httpx|aiohttp|ib_async)\b' }
    - { kind: import_from_statement, regex: '^from\s+(?:requests|httpx|aiohttp|ib_async)\b' }
    - all: [{ kind: call, regex: '(?:import_module|__import__)' }, { has: { kind: string_content, regex: '^(?:requests|httpx|aiohttp|ib_async)(?:\..*)?$', stopBy: end } }]
files: [src/**/*.py, scripts/**/*.py]
---
id: no-float-cast-in-risk
language: python
severity: error
message: Fail-closed risk invariants in risk.py must use exact Decimal or integer ticks, never float().
rule: { pattern: float($$$) }
files: [src/tier0_sota/risk.py]
---
id: no-yahoo-chart-api
language: python
severity: error
message: Yahoo Finance HTTP endpoint prohibited under Tier-0 Upstream-Only Charter.
rule: { kind: string_content, regex: '(?i)(?:query[12]\.finance\.yahoo\.com|finance\.yahoo\.com/v8/finance/chart)' }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-nonliteral-dynamic-import
language: python
severity: error
message: Non-literal dynamic import prohibited under Tier-0 Upstream-Only Charter.
rule: { any: [{ pattern: importlib.import_module($MOD) }, { pattern: $OBJ.import_module($MOD) }, { pattern: __import__($MOD) }, { pattern: $OBJ.__import__($MOD) }] }
constraints: { MOD: { not: { kind: string } } }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-nonliteral-dynamic-import-kwarg
language: python
severity: error
message: Keyword/unpacked dynamic import prohibited under Tier-0 Upstream-Only Charter.
rule: { all: [{ kind: call, regex: '(?:import_module|__import__)\s*\(' }, { has: { any: [{ kind: list_splat }, { kind: dictionary_splat }, { kind: keyword_argument, regex: '^name\s*=' }], stopBy: end } }] }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-nonliteral-dynamic-import-alias
language: python
severity: error
message: Aliased dynamic import call prohibited under Tier-0 Upstream-Only Charter.
rule:
  all:
    - { pattern: $FN($$$ARGS) }
    - inside: { kind: module, stopBy: end, has: { stopBy: end, any: [{ pattern: from importlib import import_module as $FN }, { pattern: from builtins import __import__ as $FN }, { pattern: $FN = importlib.import_module }, { pattern: $FN = __import__ }] } }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-nonliteral-getattr-dynamic-import
language: python
severity: error
message: Non-literal getattr/__getattribute__ dynamic import prohibited under Tier-0 Upstream-Only Charter.
rule: { kind: call, regex: '(?:getattr|__getattribute__)\s*\([^)]*(?:importlib|builtins|__builtins__|import_|__import|_module)[^)]*\)\s*\(' }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-nonliteral-getattr-alias-dynamic-import
language: python
severity: error
message: Aliased getattr/__getattribute__/sys.modules dynamic import prohibited under Tier-0 Upstream-Only Charter.
rule: { kind: assignment, regex: '=\s*(?:(?:builtins\.)?getattr|(?:object\.)?__getattribute__|[\w.]+\.__getattribute__|sys\.modules).*(?:import_|__import|_module|importlib)' }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-banned-exec-eval-literal
language: python
severity: error
message: Dynamic exec()/eval() containing banned library, dynamic import, or live broker endpoint prohibited.
rule: { all: [{ kind: call, regex: '(?:^|\.|["''])(?:exec|eval)(?:["'']\s*\]|["'']\s*\))?\s*\(' }, { has: { kind: string_content, regex: '(?i)(?:\b(?:import|from)\s+(?:[^\n;]*?\b)?(?:yfinance|backtrader|backtesting|mlfinlab|tcapy|vollib|py_vollib|abides|tradingview_ta|pandas_datareader|talib|vectorbt|zipline|pypfopt|pyportfolioopt|riskfolio|alphalens|wandb|clearml|neptune|prefect|deepeval|streamlit|finrl|fingpt|rdagent|rd_agent|mkdocs|sktime|freqtrade|pybroker|fastapi|starlette|httpx|aiohttp|ib_async|requests|flask|dash|gradio|nicegui|panel|bokeh)\b|__import__\s*\(|import_module\s*\(|api\.alpaca\.markets|(?:PORT\s*=\s*|:\s*)(?:4001|7496|8798|8796)\b|\bpaper(?:_trading|_mode)?\s*=\s*(?:False|0)\b)', stopBy: end } }] }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-aliased-exec-eval
language: python
severity: error
message: Aliased or reflected exec()/eval() prohibited in src/ and scripts/ under Tier-0 Upstream-Only Charter.
rule: { kind: assignment, regex: '=\s*(?:(?:(?:builtins|__builtins__)\.)?(?:exec|eval)|__builtins__\[["''](?:exec|eval)["'']\]|(?:builtins\.)?getattr\([^,]+,\s*["''](?:exec|eval)["'']\))$' }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-nonliteral-exec-eval
language: python
severity: error
message: Non-literal exec()/eval() prohibited in src/ and scripts/ under Tier-0 Upstream-Only Charter.
rule: { any: [{ pattern: exec($CODE) }, { pattern: eval($CODE) }, { pattern: builtins.exec($CODE) }, { pattern: builtins.eval($CODE) }] }
constraints: { CODE: { any: [{ not: { kind: string } }, { has: { kind: interpolation } }] } }
files: [src/**/*.py, scripts/**/*.py]
---
id: no-risk-engine-bypass
language: python
severity: error
message: Native NautilusTrader RiskEngineConfig / LiveRiskEngineConfig bypass=True is prohibited.
rule: { all: [{ any: [{ pattern: RiskEngineConfig($$$ARGS) }, { pattern: LiveRiskEngineConfig($$$ARGS) }] }, { has: { kind: keyword_argument, regex: '^bypass\s*=\s*True$', stopBy: end } }] }
files: [src/tier0_sota/**/*.py, scripts/**/*.py]
---
id: no-self-built-trading-engine-class
language: python
severity: error
message: Self-built trading engine classes are prohibited; live inside NautilusTrader v2.
rule: { all: [{ kind: class_definition }, { any: [{ has: { field: name, regex: '^(?:BacktestEngine|LiveNode|TradingNode|RiskEngine|.*(?:BacktestLoop|BacktestRunner|TradingEngine|ExecutionEngine|ShadowEngine|AgentBus|BrokerPoller))$' } }, { has: { field: superclasses, regex: '\b(?:BacktestEngine|LiveNode|TradingNode|RiskEngine|BacktestNode)\b' } }] }] }
files: [src/tier0_sota/**/*.py]
---
id: no-hardcoded-live-execution-true
language: python
severity: error
message: Hardcoded live_execution_enabled=True or paper_live_deployed=True is prohibited.
rule: { any: [{ pattern: live_execution_enabled = True }, { pattern: 'live_execution_enabled: bool = True' }, { pattern: paper_live_deployed = True }, { pattern: 'paper_live_deployed: bool = True' }] }
files: [src/tier0_sota/**/*.py, scripts/**/*.py]
---
id: no-custom-shadow-engine-wrapper-class
language: python
severity: error
message: Custom shadow order/position/pacer/throttle wrapper classes are prohibited; use NautilusTrader v2 directly.
rule: { all: [{ kind: class_definition }, { has: { field: name, regex: '^(?:PriorityVenueRatePacer|IntradayEquityThrottle|SymbolChurnGuard|OrderManager|PositionTracker|ShadowPortfolio|.*(?:RatePacer|EquityThrottle|ChurnGuard|OrderManager|PositionTracker|ShadowPortfolio|OrderTracker|BrokerPoller|ExecutionWrapper|BrokerWrapper|OrderRouter))$' } }] }
files: [src/tier0_sota/**/*.py]
---
id: no-llm-on-execution-hot-path
language: python
severity: error
message: LLMs/agent SDKs/FastMCP must remain off the synchronous NautilusTrader v2 execution & Decimal risk hot path.
rule:
  any:
    - { kind: import_statement, regex: '\b(?:anthropic|openai|litellm|langchain|langgraph|crewai|autogen|claude_agent_sdk|pydantic_ai|dspy|inspect_ai|mcp)\b' }
    - { kind: import_from_statement, regex: '^from\s+(?:anthropic|openai|litellm|langchain|langgraph|crewai|autogen|claude_agent_sdk|pydantic_ai|dspy|inspect_ai|mcp)\b' }
files: [src/tier0_sota/engine.py, src/tier0_sota/risk.py]
---
id: no-raw-http-socket-in-src
language: python
severity: error
message: Raw HTTP/socket/WebSocket primitives are prohibited inside src/tier0_sota/; use official typed upstreams.
rule:
  any:
    - { kind: import_statement, regex: '\b(?:urllib(?:\.request)?|http(?:\.client)?|socket|websockets)\b' }
    - { kind: import_from_statement, regex: '^from\s+(?:urllib\.request|http\.client|socket|websockets)\b|^from\s+urllib\s+import\s+.*\brequest\b|^from\s+http\s+import\s+.*\bclient\b' }
    - all: [{ kind: call, regex: '(?:import_module|__import__)' }, { has: { kind: string_content, regex: '^(?:urllib\.request|http\.client|socket|websockets)(?:\..*)?$', stopBy: end } }]
files: [src/tier0_sota/**/*.py]
---
id: no-polling-sleep-loop-in-src
language: python
severity: error
message: Polling while-True/while-1 sleep loops are prohibited inside src/tier0_sota/; use event-driven upstreams.
rule: { all: [{ kind: while_statement }, { has: { field: condition, regex: '^\(?\s*(?:True|1|1\s*==\s*1|True\s+is\s+True)\s*\)?$' } }, { has: { kind: call, regex: '(?:^|\.)sleep\s*\(', stopBy: end } }] }
files: [src/tier0_sota/**/*.py]

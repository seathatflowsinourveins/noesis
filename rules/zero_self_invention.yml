id: no-custom-dashboard-server
language: python
severity: error
message: >-
  Hand-written custom web/HTML dashboard prohibited under Tier-0 Upstream-Only Charter.
  Enact via skill 'tier0-upstream-dashboards-and-observability' (FINOS Workspace :1420,
  Grafana :3001, Prometheus :9090, or native create_tearsheet / generate_backtest_tearsheet).
rule:
  any:
    - pattern: import fastapi
    - pattern: import fastapi as $ALIAS
    - pattern: from fastapi import $$$
    - pattern: import starlette
    - pattern: import starlette as $ALIAS
    - pattern: from starlette import $$$
    - pattern: import flask
    - pattern: import flask as $ALIAS
    - pattern: from flask import $$$
    - pattern: import dash
    - pattern: import dash as $ALIAS
    - pattern: from dash import $$$
    - pattern: import gradio

    - pattern: from nicegui import $$$
    - pattern: import panel
    - pattern: import panel as $ALIAS
    - pattern: from panel import $$$
    - pattern: import bokeh
    - pattern: import bokeh as $ALIAS
    - pattern: from bokeh import $$$
    - pattern: import http.server
    - pattern: import http.server as $ALIAS
    - pattern: from http.server import $$$
    - pattern: HTTPServer($$$)
    - pattern: ThreadingHTTPServer($$$)
    - pattern: HTTPServer
    - pattern: ThreadingHTTPServer
    - pattern: BaseHTTPRequestHandler
    - pattern: SimpleHTTPRequestHandler
    - pattern: import uvicorn
    - pattern: import uvicorn as $ALIAS
    - pattern: from uvicorn import $$$
    - pattern: import quart
    - pattern: import quart as $ALIAS
    - pattern: from quart import $$$
    - pattern: import sanic
    - pattern: import sanic as $ALIAS
    - pattern: from sanic import $$$
    - pattern: import tornado
    - pattern: import tornado as $ALIAS
    - pattern: from tornado import $$$
    - pattern: from tornado.$$$ import $$$
    - pattern: from http import server
    - pattern: from http import server as $ALIAS
    - all:
        - kind: import_from_statement
        - has:
            field: module_name
            regex: ^http$
        - has:
            any:
              - all:
                  - kind: dotted_name
                  - regex: ^server$
              - all:
                  - kind: aliased_import
                  - has:
                      field: name
                      regex: ^server$
    - pattern: http.server
    - all:
        - kind: call
        - has:
            kind: string_content
            regex: '^(?:fastapi|starlette|flask|dash|gradio|nicegui|panel|bokeh|uvicorn|quart|sanic|tornado|http\.server)(?:\..*)?$'
            stopBy: end
        - any:
            - pattern: importlib.import_module($$$ARGS)
            - pattern: $OBJ.import_module($$$ARGS)
            - pattern: import_module($$$ARGS)
            - pattern: __import__($$$ARGS)
            - pattern: $MOD.__import__($$$ARGS)
            - pattern: getattr($OBJ, "import_module")($$$ARGS)
            - pattern: getattr($OBJ, 'import_module')($$$ARGS)
            - pattern: getattr($OBJ, "__import__")($$$ARGS)
            - pattern: getattr($OBJ, '__import__')($$$ARGS)
            - pattern: $OBJ.__getattribute__("import_module")($$$ARGS)
            - pattern: $OBJ.__getattribute__('import_module')($$$ARGS)
            - pattern: object.__getattribute__($OBJ, "import_module")($$$ARGS)
            - pattern: object.__getattribute__($OBJ, 'import_module')($$$ARGS)
            - all:
                - kind: call
                - pattern: $FN($$$ARGS)
                - inside:
                    kind: module
                    stopBy: end
                    has:
                      stopBy: end
                      any:
                        - pattern: from importlib import import_module as $FN
                        - pattern: from builtins import __import__ as $FN
                        - pattern: $FN = importlib.import_module
                        - pattern: $FN = __import__
    - pattern: HTMLResponse($$$)
files:
  - src/**/*.py
  - scripts/**/*.py

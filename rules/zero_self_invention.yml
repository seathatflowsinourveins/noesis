                      - pattern: 4002 - 1
                      - pattern: 7490 + 6
                      - pattern: 7400 + 96
                      - pattern: 7497 - 1
                      - pattern: 8790 + 8
                      - pattern: 8700 + 98
                      - pattern: 8790 + 6
                      - pattern: 8700 + 96
            - all:
                - has:
                    kind: string_content
                    regex: '(?i)^(?:paper|paper_mode|is_paper|paper_trading)$'
                    stopBy: end
                - any:
                    - pattern: setattr($OBJ, $KEY, False)
                    - pattern: setattr($OBJ, $KEY, 0)
                    - pattern: $OBJ.__setattr__($KEY, False)
                    - pattern: $OBJ.__setattr__($KEY, 0)
                    - pattern: object.__setattr__($OBJ, $KEY, False)
                    - pattern: object.__setattr__($OBJ, $KEY, 0)
files:

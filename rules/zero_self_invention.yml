id: no-polling-sleep-loop-in-src
language: python
severity: error
message: >-
  Polling while-True/while-1 sleep loops are prohibited inside src/tier0_sota/;
  use scrape-driven collectors, Nautilus MessageBus events, or Event().wait().
rule:
  all:
    - kind: while_statement
    - has:
        field: condition
        any:
          - kind: "true"
          - pattern: "1"
          - pattern: "1 == 1"
          - pattern: "True is True"
          - pattern: (True)
          - pattern: (1)
          - pattern: (1 == 1)
          - pattern: (True is True)
    - has:
        stopBy: end
        any:
          - pattern: time.sleep($$$)
          - pattern: sleep($$$)
          - pattern: asyncio.sleep($$$)
          - all:
              - kind: call
              - pattern: $FN($$$)
              - inside:
                  kind: module
                  stopBy: end
                  has:
                    stopBy: end
                    any:
                      - pattern: from time import sleep as $FN
                      - pattern: from asyncio import sleep as $FN
                      - pattern: $FN = time.sleep
                      - pattern: $FN = asyncio.sleep
          - all:
              - kind: call
              - pattern: $MOD.sleep($$$)
              - inside:
                  kind: module
                  stopBy: end
                  has:
                    stopBy: end
                    any:
                      - pattern: import time as $MOD
                      - pattern: import asyncio as $MOD
files:
  - src/tier0_sota/**/*.py

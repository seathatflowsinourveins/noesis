    - pattern: import yfinance as $ALIAS
    - pattern: from yfinance import $$$
    - pattern: import backtrader
    - pattern: import backtrader as $ALIAS
    - pattern: from backtrader import $$$
    - pattern: import backtesting
    - pattern: import backtesting as $ALIAS
    - pattern: from backtesting import $$$
    - pattern: import mlfinlab
    - pattern: import mlfinlab as $ALIAS
    - pattern: from mlfinlab import $$$
    - pattern: import tcapy
    - pattern: import tcapy as $ALIAS
    - pattern: from tcapy import $$$
    - pattern: import vollib
    - pattern: import vollib as $ALIAS
    - pattern: from vollib import $$$
    - pattern: import py_vollib
    - pattern: import py_vollib as $ALIAS

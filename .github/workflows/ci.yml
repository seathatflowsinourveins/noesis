# Upstream directives:
#   - https://github.com/astral-sh/setup-uv | https://github.com/astral-sh/ruff | https://github.com/astral-sh/ty
#   - https://github.com/fpgmaas/deptry | https://github.com/ast-grep/ast-grep | https://github.com/Z3Prover/z3 | https://github.com/pytest-dev/pytest

name: noesis — Tier-0 SOTA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: noesis-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TIER0_CATBOOST_TASK_TYPE: "CPU"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sota-quality-and-safety-gate:
    name: Quality, AST, Formal Risk & Manifest Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked environment
        run: uv sync --frozen --no-progress

      - name: Lint and format check (ruff)
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check src tests scripts evals

      - name: Type, dependency, and AST checks (ty, deptry, ast-grep)
        run: |
          uv run --no-sync ty check
          uv run --no-sync deptry .
          uv run --no-sync ast-grep scan --config sgconfig.yml

      - name: Unit tests, Z3 formal risk proofs, ADR/manifest parity, strict docs & MCP smoke
        env:
          JUNIT_XML_PATH: ${{ runner.temp }}/test-results/junit.xml
        run: |
          uv run --no-sync pytest -q --junitxml="$JUNIT_XML_PATH"
          uv run --no-sync python evals/formal_risk_z3.py
          uv run --no-sync python scripts/sync_manifest.py --check
          uv run --no-sync zensical build --clean --strict
          uv run --no-sync python scripts/nautilus_mcp_server.py --smoke

      - name: Inspect AI deterministic safety & clean-harness suite (7/7)
        run: >-
          uv run --no-sync python -c
          "import json, sys; from evals.tier0_inspect_eval import verify_inspect_safety_suite; r = verify_inspect_safety_suite(); print(json.dumps(r, sort_keys=True)); sys.exit(0 if r['ok'] else 1)"

      - name: CrossHair PEP-316 symbolic risk proofs (isolated uvx)
        run: >-
          PYTHONPATH="$PWD/src" uvx --from crosshair-tool==0.0.114
          crosshair check --per_condition_timeout=10 evals/symbolic_risk_crosshair.py

      - name: Upload JUnit XML test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-report
          path: ${{ runner.temp }}/test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

  upstream-drift-and-compose-audit:
    name: Upstream Drift, Watch Triggers & Compose Config Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose manifests (ADR-0032 container proof)
        run: |
          docker compose -f docker/compose.sota.yml config -q
          docker compose -f docker/compose.ibkr-paper.yml config -q

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked environment
        run: uv sync --frozen --no-progress

      - name: Report upstream dependency drift (majors/caps) & watch triggers
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Direct Dependency Drift (\`uv tree --frozen --outdated --depth 1 --all-groups\`)"
            echo '```text'
            uv tree --frozen --outdated --depth 1 --all-groups --no-progress | tee /dev/stderr
            echo '```'
            echo "### Dagster Upstream Watch Triggers (\`tier0_sota.definitions\`)"
            echo '```json'
            uv run --no-sync python -c "import json; from tier0_sota.definitions import _evaluate_upstream_watch_triggers; print(json.dumps(_evaluate_upstream_watch_triggers(), indent=2, sort_keys=True))" | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

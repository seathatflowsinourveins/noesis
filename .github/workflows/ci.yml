# Upstream directives:
#   - https://github.com/astral-sh/setup-uv | https://github.com/astral-sh/ruff | https://github.com/astral-sh/ty
#   - https://github.com/fpgmaas/deptry | https://github.com/ast-grep/ast-grep | https://github.com/Z3Prover/z3 | https://github.com/pytest-dev/pytest

name: noesis — Tier-0 SOTA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: noesis-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TIER0_CATBOOST_TASK_TYPE: "CPU"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sota-quality-and-safety-gate:
    name: Quality, AST, Formal Risk & Manifest Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked environment
        run: uv sync --frozen --no-progress

      - name: Lint and format check (ruff)
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check src tests scripts evals

      - name: Type, dependency, and AST checks (ty, deptry, ast-grep)
        run: |
          uv run --no-sync ty check
          uv run --no-sync deptry .
          uv run --no-sync ast-grep scan --config sgconfig.yml

      - name: Unit tests, Z3 formal risk proofs, ADR/manifest parity, strict docs & MCP smoke
        run: |
          uv run --no-sync pytest -q --junitxml=test-results/junit.xml
          uv run --no-sync python evals/formal_risk_z3.py
          uv run --no-sync python scripts/sync_manifest.py --check
          uv run --no-sync zensical build --clean --strict
          uv run --no-sync python scripts/nautilus_mcp_server.py --smoke

      - name: Upload JUnit XML test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-report
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

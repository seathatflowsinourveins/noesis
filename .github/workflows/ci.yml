# Upstream directives:
#   - https://github.com/astral-sh/setup-uv | https://github.com/astral-sh/ruff | https://github.com/astral-sh/ty
#   - https://github.com/fpgmaas/deptry | https://github.com/ast-grep/ast-grep | https://github.com/Z3Prover/z3 | https://github.com/pytest-dev/pytest

name: noesis — Tier-0 SOTA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: noesis-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TIER0_CATBOOST_TASK_TYPE: "CPU"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sota-quality-and-safety-gate:
    name: Quality, AST, Formal Risk & Manifest Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked environment
        run: uv sync --frozen --no-progress

      - name: Lint and format check (ruff)
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check src tests scripts evals

      - name: Type, dependency, and AST checks (ty, deptry, ast-grep)
        run: |
          uv run --no-sync ty check
          uv run --no-sync deptry .
          uv run --no-sync ast-grep scan --config sgconfig.yml

      - name: Unit tests, Z3 formal risk proofs, ADR/manifest parity, strict docs & MCP smoke
        env:
          JUNIT_XML_PATH: ${{ runner.temp }}/test-results/junit.xml
        run: |
          uv run --no-sync pytest -q --junitxml="$JUNIT_XML_PATH"
          uv run --no-sync python evals/formal_risk_z3.py
          uv run --no-sync python scripts/sync_manifest.py --check
          uv run --no-sync zensical build --clean --strict
          uv run --no-sync python scripts/nautilus_mcp_server.py --smoke

      - name: Inspect AI deterministic safety & clean-harness suite (7/7)
        run: >-
          uv run --no-sync python -c
          "import json, sys; from evals.tier0_inspect_eval import verify_inspect_safety_suite; r = verify_inspect_safety_suite(); print(json.dumps(r, sort_keys=True)); sys.exit(0 if r['ok'] else 1)"

      - name: CrossHair PEP-316 symbolic risk proofs (isolated uvx)
        run: >-
          PYTHONPATH="$PWD/src" uvx --from crosshair-tool==0.0.114
          crosshair check --per_condition_timeout=10 evals/symbolic_risk_crosshair.py

      - name: Upload JUnit XML test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-report
          path: ${{ runner.temp }}/test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

  pr-lock-and-compose-proof:
    name: Lockfile No-Downgrade & Compose Config Proof
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Docker Compose manifests (ADR-0032 container proof)
        run: |
          docker compose -f docker/compose.sota.yml config -q
          docker compose -f docker/compose.ibkr-paper.yml config -q

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked dev environment
        run: uv sync --frozen --only-group dev --no-install-project --no-progress

      - name: Verify uv.lock has zero package downgrades vs PR base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rc=0
          out="$(uv run --no-sync python - "$BASE_SHA" 2>&1 <<'PYEOF'
          import json
          import pathlib
          import shutil
          import subprocess
          import sys
          import tomllib
          from packaging.version import Version

          base = sys.argv[1]
          git = shutil.which("git")
          if not git:
              sys.exit("lock-proof FAIL: git not found on PATH")
          cwd = pathlib.Path.cwd().as_posix()
          proc = subprocess.run(
              [git, "-c", f"safe.directory={cwd}", "show", f"{base}:uv.lock"],
              capture_output=True,
              text=True,
              check=False,
          )
          if proc.returncode != 0:
              sys.exit(f"lock-proof FAIL: cannot read {base}:uv.lock ({proc.stderr.strip()})")
          head_path = pathlib.Path("uv.lock")
          if not head_path.is_file():
              sys.exit("lock-proof FAIL: missing uv.lock in working tree")


          def _load_versions(raw: str, label: str) -> dict[str, list[Version]]:
              doc = tomllib.loads(raw)
              pkgs = doc.get("package")
              if not isinstance(pkgs, list) or not pkgs:
                  sys.exit(f"lock-proof FAIL: {label} uv.lock has no [[package]] entries")
              versions: dict[str, list[Version]] = {}
              for pkg in pkgs:
                  name = str(pkg["name"]).lower()
                  versions.setdefault(name, []).append(Version(str(pkg["version"])))
              return {name: sorted(vers) for name, vers in versions.items()}


          old = _load_versions(proc.stdout, base)
          new = _load_versions(head_path.read_text(encoding="utf-8"), "head")
          downgraded = {
              name: {"base": [str(v) for v in old[name]], "head": [str(v) for v in new[name]]}
              for name in sorted(old.keys() & new.keys())
              if new[name][0] < old[name][0] or new[name][-1] < old[name][-1]
          }
          upgraded = sorted(
              name
              for name in (old.keys() & new.keys())
              if name not in downgraded and new[name] != old[name]
          )
          added = sorted(new.keys() - old.keys())
          removed = sorted(old.keys() - new.keys())
          summary = {
              "base": base,
              "packages": len(new),
              "upgraded": len(upgraded),
              "downgraded": downgraded,
              "added": added,
              "removed": removed,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          if downgraded:
              sys.exit(f"LOCK_PROOF_FAIL downgraded={len(downgraded)}")
          print(
              f"LOCK_PROOF_OK=1 base={base} packages={len(new)} upgraded={len(upgraded)} "
              f"downgraded=0 added={len(added)} removed={len(removed)}"
          )
          PYEOF
          )" || rc=$?
          {
            echo "### \`uv.lock\` No-Downgrade Proof (\`base=${BASE_SHA}\`)"
            echo '```text'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$out"
          exit "$rc"

  upstream-drift-and-compose-audit:
    name: Upstream Drift, Watch Triggers & Compose Config Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose manifests (ADR-0032 container proof)
        run: |
          docker compose -f docker/compose.sota.yml config -q
          docker compose -f docker/compose.ibkr-paper.yml config -q

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked environment
        run: uv sync --frozen --no-progress

      - name: Report upstream dependency drift (majors/caps) & watch triggers
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Direct Dependency Drift (\`uv tree --frozen --outdated --depth 1 --all-groups\`)"
            echo '```text'
            uv tree --frozen --outdated --depth 1 --all-groups --no-progress | tee /dev/stderr
            echo '```'
            echo "### Dagster Upstream Watch Triggers (\`tier0_sota.definitions\`)"
            echo '```json'
            uv run --no-sync python -c "import json; from tier0_sota.definitions import _evaluate_upstream_watch_triggers; print(json.dumps(_evaluate_upstream_watch_triggers(), indent=2, sort_keys=True))" | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

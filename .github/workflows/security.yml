# Upstream directives:
#   - https://github.com/gitleaks/gitleaks-action
#   - https://github.com/aquasecurity/trivy-action
#   - https://github.com/zizmorcore/zizmor-action
# SBOM artifact generation lives exclusively in release.yml; CodeQL runs via GitHub Default Setup.

name: noesis — Tier-0 SOTA Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: noesis-security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

  trivy:
    name: Filesystem Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy fs scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"
          skip-dirs: ".venv,.git,site,.claude/skills"
          version: "v0.76.2"

  zizmor:
    name: Workflow Security Audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor offline audit
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: "."
          online-audits: "false"
          persona: "pedantic"
          advanced-security: "false"
          strict-collection: "true"
          version: "1.33.1"

  zizmor-online:
    name: Workflow Security Audit, online (zizmor)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor online audits (impostor-commit, known-vulnerable-actions)
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: "."
          online-audits: "true"
          persona: "pedantic"
          advanced-security: "false"
          strict-collection: "true"
          version: "1.33.1"

  trivy-license-audit:
    name: SPDX License Audit (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked environment
        run: uv sync --frozen --no-progress

      - name: Run Trivy fs SPDX license audit (repo & lockfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "license"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"
          skip-dirs: ".venv,.git,site,.claude/skills,.cache,.ruff_cache,.pytest_cache,.hypothesis"
          trivy-config: ".github/trivy-license-fs.yaml"
          version: "v0.76.2"

      - name: Resolve synced site-packages path
        id: venv
        run: |
          site_pkgs="$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          printf 'site_pkgs=%s\n' "$site_pkgs" >> "$GITHUB_OUTPUT"

      - name: Run Trivy rootfs SPDX license audit (installed wheels; LGPL-3.0-only per ADR-0016)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "rootfs"
          scan-ref: ${{ steps.venv.outputs.site_pkgs }}
          scanners: "license"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"
          trivy-config: ".github/trivy-license-rootfs.yaml"
          version: "v0.76.2"

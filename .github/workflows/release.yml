# Upstream directives:
#   - https://github.com/astral-sh/setup-uv | https://github.com/anchore/sbom-action | https://github.com/cli/cli

name: Tier-0 SOTA Clean Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: noesis-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  TIER0_CATBOOST_TASK_TYPE: "CPU"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify-and-package:
    name: Full Verification, Build, SBOM & Checksums
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --frozen --no-progress

      - name: Run full Tier-0 verification suite
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check src tests scripts evals
          uv run --no-sync ty check
          uv run --no-sync deptry .
          uv run --no-sync ast-grep scan --config sgconfig.yml
          uv run --no-sync pytest -q
          uv run --no-sync python evals/formal_risk_z3.py
          uv run --no-sync python scripts/sync_manifest.py --check
          uv run --no-sync python scripts/nautilus_mcp_server.py --smoke

      - name: Build distribution artifacts
        run: uv build --out-dir dist

      - name: Generate CycloneDX SBOM artifact
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: "."
          format: "cyclonedx-json"
          output-file: "dist/noesis.sbom.cdx.json"
          syft-version: "v1.55.0"
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum -- ./*.whl ./*.tar.gz noesis.sbom.cdx.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  draft-release:
    name: Create Draft GitHub Release
    needs: [verify-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required solely to publish the draft GitHub Release and upload verified assets
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify artifact SHA-256 checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Publish draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --verify-tag \
            dist/*.whl \
            dist/*.tar.gz \
            dist/noesis.sbom.cdx.json \
            dist/SHA256SUMS.txt

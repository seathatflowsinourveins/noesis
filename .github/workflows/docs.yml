# Upstream directives:
#   - https://github.com/astral-sh/setup-uv | https://github.com/zensical/zensical

name: noesis — Tier-0 SOTA Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/sync_manifest.py"
      - "upstream-map.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "AGENTS.md"
      - "ARCHITECTURE_MANIFEST.json"
      - "LLM_HARNESS_MANIFEST.json"
      - "PHILOSOPHY_COMPOUNDING_MANIFEST.json"
      - "SOTA_STARRED_AND_BEYOND_MANIFEST.json"
      - "rules/zero_self_invention.yml"
      - ".omp/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/sync_manifest.py"
      - "upstream-map.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "AGENTS.md"
      - "ARCHITECTURE_MANIFEST.json"
      - "LLM_HARNESS_MANIFEST.json"
      - "PHILOSOPHY_COMPOUNDING_MANIFEST.json"
      - "SOTA_STARRED_AND_BEYOND_MANIFEST.json"
      - "rules/zero_self_invention.yml"
      - ".omp/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: noesis-docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  docs-build:
    name: Zensical Strict Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked environment
        run: uv sync --frozen --no-progress

      - name: Verify ADR graph, manifest parity, and strict Zensical docs portal
        run: |
          uv run --no-sync python scripts/sync_manifest.py --check
          uv run --no-sync zensical build --clean --strict

      - name: Upload built site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zensical-docs-site
          path: site/
          retention-days: 14
          if-no-files-found: error

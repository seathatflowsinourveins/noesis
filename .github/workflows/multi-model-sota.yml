# Upstream directives:
#   - https://github.com/anthropics/claude-code-action (OmniRoute default via OMNIROUTE_API_KEY + OMNIROUTE_BASE_URL, or banked ANTHROPIC_API_KEY strictly for high-quality SOTA runs)
#   - https://github.com/openai/codex-action (OmniRoute default via OMNIROUTE_API_KEY + OMNIROUTE_BASE_URL, or direct OPENAI_API_KEY)

name: Tier-0 Multi-Model SOTA Automation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Auth/routing tier (omniroute default, anthropic-banked-sota high-quality only, openai-codex, or all-available)"
        type: choice
        options: [omniroute, anthropic-banked-sota, openai-codex, all-available]
        default: omniroute
      model:
        description: "Optional explicit model override (leave blank for runtime default / OmniRoute combo)"
        type: string
        default: ""
      task:
        description: "Review or audit prompt passed safely via action input"
        type: string
        default: "Review repository alignment with AGENTS.md and PHILOSOPHY_COMPOUNDING_MANIFEST.json without modifying src/tier0_sota/risk.py."

concurrency:
  group: tier0-multi-model-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  claude-omniroute-or-anthropic-banked:
    name: Claude Code (OmniRoute Primary / Banked Anthropic SOTA)
    if: inputs.provider == 'omniroute' || inputs.provider == 'anthropic-banked-sota' || inputs.provider == 'all-available'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Required by official anthropics/claude-code-action OIDC handshake
    steps:
      - name: Select OmniRoute or Banked Anthropic SOTA secret cleanly
        id: auth-check
        env:
          PROVIDER_CHOICE: ${{ inputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
        run: |
          if [ "$PROVIDER_CHOICE" = "anthropic-banked-sota" ]; then
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              echo "has_key=true" >> "$GITHUB_OUTPUT"
              echo "use_omniroute=false" >> "$GITHUB_OUTPUT"
            else
              echo "has_key=false" >> "$GITHUB_OUTPUT"
              echo "use_omniroute=false" >> "$GITHUB_OUTPUT"
              echo "Skipped banked Anthropic SOTA lane cleanly: configure ANTHROPIC_API_KEY (reserved for high-quality SOTA runs only)."
            fi
          else
            if [ -n "$OMNIROUTE_API_KEY" ] && [ -n "$OMNIROUTE_BASE_URL" ]; then
              echo "has_key=true" >> "$GITHUB_OUTPUT"
              echo "use_omniroute=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_key=false" >> "$GITHUB_OUTPUT"
              echo "use_omniroute=false" >> "$GITHUB_OUTPUT"
              echo "Skipped Claude OmniRoute lane cleanly: configure OMNIROUTE_API_KEY + OMNIROUTE_BASE_URL (or run provider=anthropic-banked-sota with ANTHROPIC_API_KEY for SOTA tasks)."
            fi
          fi

      - name: Checkout repository
        if: steps.auth-check.outputs.has_key == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Claude Code Action (OmniRoute)
        if: steps.auth-check.outputs.has_key == 'true' && steps.auth-check.outputs.use_omniroute == 'true'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.OMNIROUTE_API_KEY }}
          claude_args: ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
          allow_fork_prs: "false"
          restrict_untrusted_prs: "true"
          prompt: ${{ inputs.task }}

      - name: Run Claude Code Action (Banked Anthropic SOTA)
        if: steps.auth-check.outputs.has_key == 'true' && steps.auth-check.outputs.use_omniroute == 'false'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: ${{ inputs.model != '' && format('--model {0}', inputs.model) || '--model opus' }}
          allow_fork_prs: "false"
          restrict_untrusted_prs: "true"
          prompt: ${{ inputs.task }}

  codex-omniroute-or-openai:
    name: OpenAI Codex (OmniRoute Primary / Direct OpenAI)
    if: inputs.provider == 'omniroute' || inputs.provider == 'openai-codex' || inputs.provider == 'all-available'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Select OmniRoute or Direct OpenAI secret cleanly
        id: auth-check
        env:
          PROVIDER_CHOICE: ${{ inputs.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
        run: |
          if [ "$PROVIDER_CHOICE" = "openai-codex" ]; then
            if [ -n "$OPENAI_API_KEY" ]; then
              echo "has_key=true" >> "$GITHUB_OUTPUT"
              echo "use_omniroute=false" >> "$GITHUB_OUTPUT"
            else
              echo "has_key=false" >> "$GITHUB_OUTPUT"
              echo "use_omniroute=false" >> "$GITHUB_OUTPUT"
              echo "Skipped direct OpenAI Codex lane cleanly: configure OPENAI_API_KEY in repository secrets."
            fi
          elif [ -n "$OMNIROUTE_API_KEY" ] && [ -n "$OMNIROUTE_BASE_URL" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "use_omniroute=true" >> "$GITHUB_OUTPUT"
          elif [ "$PROVIDER_CHOICE" = "all-available" ] && [ -n "$OPENAI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "use_omniroute=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "use_omniroute=false" >> "$GITHUB_OUTPUT"
            echo "Skipped Codex lane cleanly: configure OMNIROUTE_API_KEY + OMNIROUTE_BASE_URL (or OPENAI_API_KEY for direct OpenAI)."
          fi

      - name: Checkout repository
        if: steps.auth-check.outputs.has_key == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenAI Codex Action (OmniRoute)
        if: steps.auth-check.outputs.has_key == 'true' && steps.auth-check.outputs.use_omniroute == 'true'
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
        env:
          OPENAI_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
        with:
          openai-api-key: ${{ secrets.OMNIROUTE_API_KEY }}
          model: ${{ inputs.model }}
          sandbox: read-only
          safety-strategy: drop-sudo
          prompt: ${{ inputs.task }}

      - name: Run OpenAI Codex Action (Direct OpenAI)
        if: steps.auth-check.outputs.has_key == 'true' && steps.auth-check.outputs.use_omniroute == 'false'
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ inputs.model }}
          sandbox: read-only
          safety-strategy: drop-sudo
          prompt: ${{ inputs.task }}

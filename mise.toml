# noesis — Tier-0 SOTA — Declarative Upstream CLI Toolchain Manifest
# Managed via official mise registry backends (core/aqua) with minor-version pins
# compatible across Windows 11, WSL2 Noesis-SOTA, and Ubuntu GitHub Actions runners.
# Python virtual environments remain managed natively by `uv` (.venv on Windows,
# $HOME/noesis/.venv on WSL2) to preserve cross-OS parity.

[tools]
python = "3.13"
node = "24"
uv = "0.13"
just = "1.59"
ruff = "0.17"
gitleaks = "8.30"
trivy = "0.76"
zizmor = "1.33"
syft = "1.55"
prek = "0.5"
ast-grep = "0.51"
fnox = "1.50"
age = "1.3"

[env]
PYTHONDONTWRITEBYTECODE = "1"

allowed_paper_venues = ["IBKR_PAPER_4002", "ALPACA_PAPER_200"]
# Zero Self-Invention is strictly enforced via real upstream gates only:
# ast-grep rules, uv.lock single-winner + banned-package & SPDX OSI firewalls,
# deptry, ruff, ty, prek, zizmor, trivy, gitleaks, Z3 SMT proofs, exact risk.py SHA-256,
# and live_execution_enabled = False (zero arbitrary LOC caps).

[meta_convergence_practice]
standards = [
  "AAIF AGENTS.md",
  "MADR 4.0 (living evolvable ADRs)",
  "PEP 735 (uv.lock default-groups)",
  "SPDX OSI License Firewall",
  "Conventional Commits",
]

[project]
name = "noesis"
version = "0.1.0"
description = "Clean-room Tier-0 SOTA-converged quantitative trading & research stack."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alpaca-py==0.45.0",
    "arch>=9.0.0",
    "dagster==1.13.31",
    "duckdb>=1.4.0",
    "exchange-calendars>=4.13.2",
    "hftbacktest>=2.4.0",
    # 2026-11-27: edgartools 6.4.0 [ai] requires mcp<2.0.0,>=1.28.1 (https://pypi.org/pypi/edgartools/6.4.0/json); re-open when edgartools ships its MCP server on mcp 2
    "mcp>=1.28.1,<2.0.0",
    "ml4t-diagnostic>=0.2.0",
    "ml4t-engineer>=0.2.0",
    "mlflow>=3.0.0",
    "nautilus_trader==2.0.0rc9",
    # 2026-11-27: hftbacktest 2.4.4 requires numpy<2.3,>=2.0 (https://pypi.org/pypi/hftbacktest/2.4.4/json); re-open when an hftbacktest release allows numpy>=2.3
    "numpy>=2.0.0,<2.3",
    "pandas-market-calendars>=5.7.0",
    "pandera>=0.35.0",
    "polars>=2.1.0",
    "pydantic>=2.10.0",
    "river>=0.22.0",
    "ruptures>=1.1.9",
    "scipy>=1.14.0",
    "skfolio>=1.12.7",
    "statsmodels>=0.15.0",
    "stumpy>=1.13.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.49.0",
    "google-genai>=1.0.0",
    "openai>=1.65.0",
]

[dependency-groups]
dev = [
    "ast-grep-cli>=0.51.3",
    "deptry>=0.23.0",
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pyyaml>=6.0.2",
    "ruff>=0.17.3",
    "ty>=0.0.100",
]
research = [
    "catboost>=1.2.0",
    "edgartools>=6.0.0",
    "fredapi>=0.5.2",
    "lightgbm>=4.5.0",
    "mapie>=1.6.0",
    "pyarrow>=26.0.0",
    "shap>=0.54.0",
    "shapiq>=1.8.0",
    "skchange>=0.18.0",
    "sqlglot>=30.35.0",
]
data-versioning = [
    "dvc>=3.67.1",
]
test-reports = [
    "allure-pytest==2.16.2",
]
evals = [
    "dspy>=3.0.0",
    "inspect-ai>=0.3.0",
    "z3-solver>=4.13.0",
]
portals = [
    "dagster-webserver==1.13.31",
    "optuna>=4.0.0",
    "optuna-dashboard==0.21.0",
    "zensical>=0.1.3",
]
observability = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "prometheus-client>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tier0_sota"]

[tool.uv]
default-groups = ["dev", "research", "evals", "portals", "observability"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "evals"]
extend-exclude = [".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]
"evals/*" = ["S101", "S603"]

[tool.ruff.format]
exclude = ["src/tier0_sota/risk.py"]

[tool.ty.src]
exclude = [".claude/skills/**"]

[tool.deptry]
known_first_party = ["tier0_sota", "evals", "scripts"]
ignore_notebooks = true
extend_exclude = ["\\.claude/skills", "site"]
non_dev_dependency_groups = ["evals"]

[tool.deptry.package_module_name_map]
anthropic = "anthropic"
dvc = "dvc"
edgartools = "edgar"
google-genai = "google_genai"
openai = "openai"
opentelemetry-api = "opentelemetry"
opentelemetry-exporter-otlp = "opentelemetry"
opentelemetry-sdk = "opentelemetry"
prometheus-client = "prometheus_client"
pyyaml = "yaml"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "anthropic",
  "google-genai",
  "openai",
]
DEP004 = [
  "catboost",
  "edgar",
  "fredapi",
  "lightgbm",
  "mapie",
  "opentelemetry",
  "optuna",
  "prometheus_client",
  "shap",
  "shapiq",
  "skchange",
  "sqlglot",
  "yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "noesis_data_gpu: requires local pre-wall Parquet lake and local CUDA GPU",
]

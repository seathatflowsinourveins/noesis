[project]
name = "tier0-sota-clean"
version = "0.1.0"
description = "Clean-room Tier-0 SOTA-converged quantitative trading & research stack."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alpaca-py==0.45.0",
    "arch>=9.0.0",
    "catboost>=1.2.0",
    "dagster==1.13.31",
    "dagster-webserver==1.13.31",
    "dspy>=3.0.0",
    "duckdb>=1.4.0",
    "dvc>=3.60.0",
    "edgartools>=6.0.0",
    "exchange-calendars>=4.13.2",
    "fredapi>=0.5.2",
    "hftbacktest>=2.4.0",
    "inspect-ai>=0.3.0",
    "lightgbm>=4.5.0",
    "mcp>=1.28.1,<2.0.0",
    "ml4t-diagnostic>=0.2.0",
    "ml4t-engineer>=0.2.0",
    "mlflow>=3.0.0",
    "nautilus_trader==2.0.0rc9",
    "numpy>=2.0.0,<2.3",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "optuna>=4.0.0",
    "optuna-dashboard==0.21.0",
    "pandera>=0.35.0",
    "polars>=2.1.0",
    "prometheus-client>=0.21.0",
    "pyarrow>=26.0.0",
    "river>=0.22.0",
    "ruptures>=1.1.9",
    "scipy>=1.14.0",
    "shap>=0.54.0",
    "skfolio>=1.12.7",
    "statsmodels>=0.15.0",
    "stumpy>=1.13.0",
    "z3-solver>=4.13.0",
    "zensical>=0.1.3",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.49.0",
    "google-genai>=1.0.0",
    "openai>=1.65.0",
]

[dependency-groups]
dev = [
    "ast-grep-cli>=0.51.3",
    "deptry>=0.23.0",
    "hypothesis>=6.170.15",
    "pre-commit>=4.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tier0_sota"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "evals"]
extend-exclude = [".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]
"evals/*" = ["S101", "S603"]

[tool.ty.src]
exclude = [".claude/skills/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "noesis_data_gpu: requires local pre-wall Parquet lake and local CUDA GPU",
]

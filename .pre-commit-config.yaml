repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # v0.17.6
    hooks:
      - id: ruff-check
        files: ^(src|tests|scripts)/
      - id: ruff-format
        args: [--check]
        types_or: [python, pyi]
        files: ^(src|tests|scripts)/
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/[^/]+\.sh$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]
        files: ^\.github/workflows/[^/]+\.ya?ml$
  - repo: local
    hooks:
      - id: no-tracked-dotenv
        name: no dotenv file other than .env.example is committed
        entry: Dotenv files hold keys and stay out of git. Only .env.example may be committed.
        language: fail
        files: (^|/)\.env(?!\.example$)
      - id: no-tracked-notebook
        name: no Jupyter notebook is committed
        entry: Notebooks hold code cells and shell magics that no gate parses. Use scripts or tests.
        language: fail
        files: (?i)\.ipynb$
      - id: no-handwritten-web-assets
        name: no hand-written HTML, JS or TS under src or scripts
        entry: Dashboards come from upstream platforms (zero self-edit UI). No web assets here.
        language: fail
        files: ^(src|scripts)/.*\.(html?|[cm]?[jt]sx?)$
      - id: ty
        name: ty type check
        entry: bash -c 'if [ -x .venv/Scripts/ty.exe ]; then exec .venv/Scripts/ty.exe check --python .venv/Scripts/python.exe src tests scripts; elif [ -x .venv/bin/ty ]; then exec .venv/bin/ty check --python .venv/bin/python src tests scripts; else exec uv run --no-sync ty check src tests scripts; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: ast-grep
        name: ast-grep structural rules
        entry: bash -c 'if [ -x .venv/Scripts/ast-grep.exe ]; then exec .venv/Scripts/ast-grep.exe scan; elif [ -x .venv/bin/ast-grep ]; then exec .venv/bin/ast-grep.exe scan 2>/dev/null || exec .venv/bin/ast-grep scan; else exec uv run --no-sync ast-grep scan; fi'
        language: system
        pass_filenames: false
        always_run: true

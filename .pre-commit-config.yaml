repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
        exclude: ^\.claude/skills/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff-check
        files: ^(src|tests|scripts|evals)/
      - id: ruff-format
        args: [--check]
        types_or: [python, pyi]
        files: ^(src|tests|scripts|evals)/
        exclude: ^src/tier0_sota/risk\.py$
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8  # frozen: v1.33.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline, --persona=pedantic]
  - repo: local
    hooks:
      - id: no-tracked-dotenv
        name: no dotenv file other than .env.example is committed
        entry: Dotenv files hold keys and stay out of git. Only .env.example may be committed.
        language: fail
        files: (^|/)\.env(?!\.example$)
      - id: no-tracked-notebook
        name: no Jupyter notebook is committed
        entry: Notebooks hold code cells and shell magics that no gate parses. Use scripts or tests.
        language: fail
        files: (?i)\.ipynb$
      - id: no-handwritten-web-assets
        name: no hand-written HTML, JS or TS under src or scripts
        entry: Dashboards come from upstream platforms (zero self-edit UI). No web assets here.
        language: fail
        files: ^(src|scripts)/.*\.(html?|[cm]?[jt]sx?)$
      - id: ty
        name: ty type check
        entry: bash -c 'if [ "$(uname -s)" = "Linux" ] && [ -x "$HOME/noesis/.venv/bin/ty" ]; then exec "$HOME/noesis/.venv/bin/ty" check --python "$HOME/noesis/.venv/bin/python" src tests scripts evals; elif [ "$(uname -s)" = "Linux" ] && [ -x .venv/bin/ty ]; then exec .venv/bin/ty check --python .venv/bin/python src tests scripts evals; elif [ -x .venv/Scripts/ty.exe ]; then exec .venv/Scripts/ty.exe check --python .venv/Scripts/python.exe src tests scripts evals; else exec uv run --no-sync ty check src tests scripts evals; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: ast-grep
        name: ast-grep structural rules
        entry: bash -c 'if [ "$(uname -s)" = "Linux" ] && [ -x "$HOME/noesis/.venv/bin/ast-grep" ]; then exec "$HOME/noesis/.venv/bin/ast-grep" scan --config sgconfig.yml; elif [ "$(uname -s)" = "Linux" ] && [ -x .venv/bin/ast-grep ]; then exec .venv/bin/ast-grep scan --config sgconfig.yml; elif [ -x .venv/Scripts/ast-grep.exe ]; then exec .venv/Scripts/ast-grep.exe scan --config sgconfig.yml; else exec uv run --no-sync ast-grep scan --config sgconfig.yml; fi'
        language: system
        pass_filenames: false
        always_run: true

services:
  mlflow:
    image: tier0-sota-research:latest
    cpus: "2.0"
    mem_limit: 1536m
    build:
      context: ..
      dockerfile: docker/Dockerfile.research
    user: "1000:1000"
    working_dir: /workspace
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////state/mlflow/mlflow.db
      - --default-artifact-root
      - /state/mlflow/mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow:5000,127.0.0.1:5000,localhost:5000,${TIER0_TAILSCALE_HOST:-localhost}:5000,${TIER0_TAILSCALE_SHORT:-localhost}:5000,${TIER0_TAILSCALE_IP:-127.0.0.1}:5000
      - --cors-allowed-origins
      - http://127.0.0.1:5000,http://localhost:5000,http://${TIER0_TAILSCALE_HOST:-localhost}:5000,https://${TIER0_TAILSCALE_HOST:-localhost}:5000,http://${TIER0_TAILSCALE_SHORT:-localhost}:5000
      - --workers
      - "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ${TIER0_REPO_ROOT:-..}:/workspace
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/mlflow:/state/mlflow
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/mlflow-assistant:/tmp/.mlflow/assistant
    environment:
      - HOME=/tmp
      - USER=sota
      - LOGNAME=sota
      - MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false
      - MLFLOW_GATEWAY_API_BASE_ALLOW_PRIVATE_IPS=true
      - MLFLOW_ENABLE_REMOTE_ASSISTANT=true
      - MLFLOW_ENABLE_ASSISTANT_SANDBOX=true
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - BLIS_NUM_THREADS=2
      - POLARS_MAX_THREADS=2
      - RAYON_NUM_THREADS=2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:5000/health"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  optuna-dashboard:
    image: tier0-sota-research:latest
    cpus: "1.0"
    mem_limit: 768m
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    command:
      - optuna-dashboard
      - sqlite:////state/mlflow/optuna.db
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${TIER0_REPO_ROOT:-..}:/workspace
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/mlflow:/state/mlflow
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/mlflow-assistant:/tmp/.mlflow/assistant
    environment:
      - HOME=/tmp
      - USER=sota
      - LOGNAME=sota
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - BLIS_NUM_THREADS=2
      - POLARS_MAX_THREADS=2
      - RAYON_NUM_THREADS=2
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dagster-code-server:
    image: tier0-sota-research:latest
    cpus: "2.0"
    mem_limit: 2g
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    command:
      - dagster
      - api
      - grpc
      - -h
      - 0.0.0.0
      - -p
      - "4266"
      - -m
      - tier0_sota.definitions
      - -d
      - /workspace
      - --max-workers
      - "4"
    volumes:
      - ${TIER0_REPO_ROOT:-..}:/workspace
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/dagster_home:/var/dagster_home
      - ./dagster.yaml:/var/dagster_home/dagster.yaml:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/prewall-lake:/mnt/z/sota-data/prewall-lake:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/manifests:/mnt/z/sota-data/manifests
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/duckdb:/mnt/z/sota-data/duckdb:ro
    environment:
      - HOME=/tmp
      - USER=sota
      - LOGNAME=sota
      - DAGSTER_HOME=/var/dagster_home
      - TIER0_MARKET_DATA_ROOT=/mnt/z/sota-data/prewall-lake
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - XERJ_URL=http://xerj:9200
      - PYTHONPATH=/workspace/src:/workspace
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NUMEXPR_NUM_THREADS=4
      - BLIS_NUM_THREADS=4
      - POLARS_MAX_THREADS=4
      - RAYON_NUM_THREADS=4
      - TIER0_DUCKDB_THREADS=4
    depends_on:
      - mlflow
      - xerj
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4266'"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  dagster-webserver:
    image: tier0-sota-research:latest
    cpus: "1.0"
    mem_limit: 1g
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    command:
      - dagster-webserver
      - -w
      - /var/dagster_home/workspace.yaml
      - -h
      - 0.0.0.0
      - -p
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${TIER0_REPO_ROOT:-..}:/workspace
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/dagster_home:/var/dagster_home
      - ./dagster.yaml:/var/dagster_home/dagster.yaml:ro
      - ./workspace.yaml:/var/dagster_home/workspace.yaml:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/prewall-lake:/mnt/z/sota-data/prewall-lake:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/manifests:/mnt/z/sota-data/manifests:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/duckdb:/mnt/z/sota-data/duckdb:ro
    environment:
      - HOME=/tmp
      - USER=sota
      - LOGNAME=sota
      - DAGSTER_HOME=/var/dagster_home
      - TIER0_MARKET_DATA_ROOT=/mnt/z/sota-data/prewall-lake
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - XERJ_URL=http://xerj:9200
      - PYTHONPATH=/workspace/src:/workspace
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - BLIS_NUM_THREADS=2
      - POLARS_MAX_THREADS=2
      - RAYON_NUM_THREADS=2
    depends_on:
      dagster-code-server:
        condition: service_healthy
      mlflow:
        condition: service_started
      xerj:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:3000/server_info"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dagster-daemon:
    image: tier0-sota-research:latest
    cpus: "1.5"
    mem_limit: 1g
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    command:
      - dagster-daemon
      - run
      - -w
      - /var/dagster_home/workspace.yaml
    volumes:
      - ${TIER0_REPO_ROOT:-..}:/workspace
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/dagster_home:/var/dagster_home
      - ./dagster.yaml:/var/dagster_home/dagster.yaml:ro
      - ./workspace.yaml:/var/dagster_home/workspace.yaml:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/prewall-lake:/mnt/z/sota-data/prewall-lake:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/manifests:/mnt/z/sota-data/manifests:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/duckdb:/mnt/z/sota-data/duckdb:ro
    environment:
      - HOME=/tmp
      - USER=sota
      - LOGNAME=sota
      - DAGSTER_HOME=/var/dagster_home
      - TIER0_MARKET_DATA_ROOT=/mnt/z/sota-data/prewall-lake
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - XERJ_URL=http://xerj:9200
      - PYTHONPATH=/workspace/src:/workspace
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - BLIS_NUM_THREADS=2
      - POLARS_MAX_THREADS=2
      - RAYON_NUM_THREADS=2
    depends_on:
      dagster-code-server:
        condition: service_healthy
      dagster-webserver:
        condition: service_started
      xerj:
        condition: service_started
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 600s
      start_interval: 10s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  inspect-view:
    image: tier0-sota-research:latest
    cpus: "1.0"
    mem_limit: 768m
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    command:
      - inspect
      - view
      - start
      - --host
      - 0.0.0.0
      - --port
      - "7575"
      - --unsafe-allow-unauthenticated
      - --trusted-origin
      - http://127.0.0.1:7575
      - --trusted-origin
      - http://localhost:7575
      - --trusted-origin
      - http://${TIER0_TAILSCALE_HOST:-localhost}:7575
      - --trusted-origin
      - https://${TIER0_TAILSCALE_HOST:-localhost}:7575
      - --trusted-origin
      - http://${TIER0_TAILSCALE_SHORT:-localhost}:7575
      - --trusted-host
      - 127.0.0.1:7575
      - --trusted-host
      - localhost:7575
      - --trusted-host
      - ${TIER0_TAILSCALE_HOST:-localhost}:7575
      - --trusted-host
      - ${TIER0_TAILSCALE_SHORT:-localhost}:7575
      - --trusted-host
      - ${TIER0_TAILSCALE_IP:-127.0.0.1}:7575
      - --log-dir
      - /state/inspect-logs
    ports:
      - "127.0.0.1:7575:7575"
    volumes:
      - ${TIER0_REPO_ROOT:-..}:/workspace
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/inspect-logs:/state/inspect-logs
    environment:
      - HOME=/tmp
      - USER=sota
      - LOGNAME=sota
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - BLIS_NUM_THREADS=2
      - POLARS_MAX_THREADS=2
      - RAYON_NUM_THREADS=2
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:7575/"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  zensical:
    image: tier0-sota-research:latest
    cpus: "1.0"
    mem_limit: 512m
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    command:
      - zensical
      - serve
      - --dev-addr
      - 0.0.0.0:8000
      - --external-origin
      - https://${TIER0_TAILSCALE_HOST:-localhost}:8010
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ${TIER0_REPO_ROOT:-..}:/workspace
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/zensical-site:/workspace/site
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/zensical-cache:/workspace/.cache
    environment:
      - HOME=/tmp
      - USER=sota
      - LOGNAME=sota
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - BLIS_NUM_THREADS=2
      - POLARS_MAX_THREADS=2
      - RAYON_NUM_THREADS=2
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  telemetry-exporter:
    image: otel/opentelemetry-collector-contrib:0.166.0
    cpus: "1.0"
    mem_limit: 512m
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - GOMAXPROCS=1
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    cpus: "2.0"
    mem_limit: 1g
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
      - prometheus_data:/prometheus
    environment:
      - GOMAXPROCS=2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=http://127.0.0.1:9090
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    depends_on:
      - telemetry-exporter
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.1
    profiles:
      - alerting
    cpus: "0.25"
    mem_limit: 128m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      - GOMAXPROCS=1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 60s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2
    cpus: "2.0"
    mem_limit: 1g
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GOMAXPROCS=2
      - GF_SERVER_ROOT_URL=https://${TIER0_TAILSCALE_HOST:-localhost}:3001
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      - GF_PLUGINS_DISABLE_PLUGINS=cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
      # Metrics Drilldown is a catalog plugin Grafana preinstalls on startup (not in the image);
      # pin the version so the default preinstall_auto_update cannot change it on recreate.
      - GF_PLUGINS_PREINSTALL=grafana-metricsdrilldown-app@3.2.0
      - GF_UNIFIED_ALERTING_ENABLED=false
      - GF_LIVE_MAX_CONNECTIONS=0
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_LOG_LEVEL=warn
      - GF_LOG_FILTERS=search-manifest-watcher:error
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  xerj:
    image: tier0-sota-xerj:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.xerj
    cpus: "2.0"
    mem_limit: 1g
    user: "1000:1000"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ${TIER0_STATE_ROOT:-${HOME}/tier0-sota-state}/xerj-data:/data
    environment:
      - HOME=/tmp
      - XERJ_LOG=info
      - XERJ_BIND_ADDRESS=0.0.0.0
      - XERJ_ALLOW_INSECURE_NETWORK_BIND=true
      - XERJ_DISABLE_FEEDBACK=true
      - TOKIO_WORKER_THREADS=4
      - RAYON_NUM_THREADS=4
    command:
      - --insecure
      - --data-dir
      - /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:9200/"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  tearsheets:
    image: caddy:2.11.9-alpine
    cpus: "0.5"
    mem_limit: 256m
    user: "1000:1000"
    network_mode: host
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/manifests:/mnt/z/sota-data/manifests:ro
    environment:
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/caddy/config
      - XDG_DATA_HOME=/tmp/caddy/data
      - GOMAXPROCS=1
      - TIER0_TAILSCALE_HOST=${TIER0_TAILSCALE_HOST:-localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8793/ || exit 1"]
      interval: 120s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Optional portals-profile helper for inspecting FINOS workspace plugin mounts.
  # Live FINOS Workspace (:1420/:8000) is served by WSL2 workspace-local, and :6900 is owned
  # exclusively by WSL2 systemd unit tier0-openbb-backend per ADR-0017 (never bind :6900 here).
  finos-workspace:
    image: tier0-sota-research:latest
    profiles:
      - portals
    cpus: "2.0"
    mem_limit: 1g
    pull_policy: never
    user: "1000:1000"
    working_dir: /mnt/z/sota-data/hosted-research-frameworks/finos-workspace-plugins
    command:
      - python
      - -c
      - "import pathlib; p=pathlib.Path('/mnt/z/sota-data/hosted-research-frameworks/finos-workspace-plugins'); assert p.is_dir(); print({'finos_plugins_mount_ok': True, 'entries': sorted(x.name for x in p.iterdir())})"
    ports:
      - "127.0.0.1:1420:1420"
      - "127.0.0.1:8000:8000"
    volumes:
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/hosted-research-frameworks:/mnt/z/sota-data/hosted-research-frameworks:ro
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/manifests:/mnt/z/sota-data/manifests:ro
    environment:
      - HOME=/tmp
      - PAPER_ONLY=true
      - LIVE_EXECUTION_ENABLED=false
    restart: "no"

  aideml-sandbox:
    profiles:
      - sandbox
    image: tier0-sota-aideml-sandbox:latest
    cpus: "4.0"
    mem_limit: 8g
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "1000:1000"
    volumes:
      - ${TIER0_DATA_ROOT:-/mnt/z/sota-data}/prewall-lake:/data/prewall-lake:ro
    command:
      - python
      - -c
      - "import importlib.metadata as m, aide; print({'aideml': m.version('aideml'), 'network': 'none'})"

volumes:
  prometheus_data:
  grafana_data:

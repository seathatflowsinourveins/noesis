global:
  resolve_timeout: 5m

route:
  receiver: tier0-local-null
  group_by: ["alertname", "category", "lane", "severity"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h
  routes:
    - matchers:
        - category="momentum"
      receiver: tier0-local-null
      group_by: ["alertname", "session", "calibrated_category", "severity"]
      group_wait: 20s
      group_interval: 5m
      repeat_interval: 1h
    - matchers:
        - category="lossless_trailing"
      receiver: tier0-local-null
      group_by: ["alertname", "symbol", "account", "session"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
    - matchers:
        - category="risk_ops"
      receiver: tier0-local-null
      group_by: ["alertname", "lane", "severity"]
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal: ["lane"]
  - source_matchers:
      - alertname="Tier0PaperTelemetryOrExecutionDown"
      - lane="paper"
    target_matchers:
      - category=~"momentum|lossless_trailing"
      - lane="paper"
    equal: ["lane"]

receivers:
  # Clean local null/default receiver template (zero secrets).
  # Provide encrypted webhook/paging secrets via fnox before enabling external notification routes.
  - name: tier0-local-null

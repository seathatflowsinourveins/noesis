global:
  resolve_timeout: 5m

route:
  receiver: tier0-local-null
  group_by: ["alertname", "lane", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Clean local null/default receiver template (zero secrets).
  # Provide encrypted webhook/paging secrets via fnox before enabling external notification routes.
  - name: tier0-local-null

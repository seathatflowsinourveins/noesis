# noesis — Tier-0 SOTA — Declarative Encrypted Secret Profiles (jdx/fnox + FiloSottile/age)
# Zero plaintext secrets in git; private age key lives outside the repository
# (~/.config/fnox/age.txt or $FNOX_AGE_KEY_FILE). Stage-5 live profile stays physically isolated.

default_provider = "age"

[providers.age]
type = "age"
recipients = ["age18p7ze4w2qge89gcd8cdk25ym6upg0fmyy9azz4hhys8a4kpmwsvqqp7p7z"]

[secrets]
FRED_API_KEY = { provider = "age", description = "Optional FRED macro API key", if_missing = "ignore" }
APCA_API_KEY_ID= { provider = "age", value = "", description = "Alpaca Paper SIP market data API key ID" }
APCA_API_SECRET_KEY= { provider = "age", value = "", description = "Alpaca Paper SIP market data API secret key" }
EDGAR_IDENTITY= { provider = "age", value = "", description = "SEC EDGAR User-Agent identity for EdgarTools" }

[profiles.data]

[profiles.paper.secrets]
ALPACA_PAPER = { default = "true", description = "Fail-closed Alpaca paper mode flag" }
IBKR_HOST = { default = "127.0.0.1", description = "Local IBKR paper gateway loopback host" }
IBKR_PORT = { default = "4002", description = "Fail-closed IBKR paper gateway port (never live 4001/7496)" }
ALPACA_PA1_API_KEY= { provider = "age", value = "", description = "Alpaca Paper Lane PA1 API key" }
ALPACA_PA1_SECRET= { provider = "age", value = "", description = "Alpaca Paper Lane PA1 API secret" }
ALPACA_PA2_API_KEY= { provider = "age", value = "", description = "Alpaca Paper Lane PA2 API key" }
ALPACA_PA2_SECRET_KEY= { provider = "age", value = "", description = "Alpaca Paper Lane PA2 API secret" }
ALPACA_PA3_API_KEY= { provider = "age", value = "", description = "Alpaca Paper Lane PA3 API key" }
ALPACA_PA3_SECRET_KEY= { provider = "age", value = "", description = "Alpaca Paper Lane PA3 API secret" }

[profiles.live.providers.age_live]
type = "age"
recipients = ["age18p7ze4w2qge89gcd8cdk25ym6upg0fmyy9azz4hhys8a4kpmwsvqqp7p7z"]
key_file = "~/.config/fnox/live-age.txt"

[profiles.live.secrets]
LIVE_EXECUTION_ENABLED = { default = "false", description = "Fail-closed live execution lock until full Stage-5 promotion" }
ALPACA_LIVE_API_KEY = { provider = "age_live", description = "Dormant Stage-5 live broker API key (isolated key_file)", if_missing = "ignore" }
ALPACA_LIVE_SECRET_KEY = { provider = "age_live", description = "Dormant Stage-5 live broker API secret key (isolated key_file)", if_missing = "ignore" }
